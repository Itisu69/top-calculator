<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="header">
        <div class="title-container">
            <h1 class="title">Calculator</h1>
        </div>
        <div class="author">
            <p>Made by <a href="https://github.com/Itisu69">Itisu69 <img class="github-icon" src="images/Octicons-mark-github.svg"></a></p>
        </div>
    </div>

    <div class="calc-container">
        <div class="calc">
            <div class="calc-display">
                <p>0</p>
            </div>
            <div class="calc-buttons">
                <div class="calc-nums">
                    <div class="calc-functions">
                        <button class="backspace">⌫</button>
                        <button>CE</button>
                    </div>
                    
                    <div class="calc-num-row">
                        <button>7</button>
                        <button>8</button>
                        <button>9</button>
                    </div>
                    <div class="calc-num-row">
                        <button>4</button>
                        <button>5</button>
                        <button>6</button>
                    </div>
                    <div class="calc-num-row">
                        <button>1</button>
                        <button>2</button>
                        <button>3</button>
                    </div>
                    <div class="calc-num-row">
                        <button>0</button>
                        <button class="negat">+/-</button>
                        <button class="decimal">.</button>
                    </div>
                </div>
                <div class="calc-operators">
                    <button>+</button>
                    <button>-</button>
                    <button>/</button>
                    <button>x</button>
                    <button class="equals">=</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
